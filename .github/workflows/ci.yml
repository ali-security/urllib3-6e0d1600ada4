name: CI

on:
  workflow_dispatch:

permissions: read-all

defaults:
  run:
    shell: bash

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Check packages
        env:
          PIP_INDEX_URL: https://:2023-10-02@time-machines-pypi.sealsecurity.io/
        run: |
          python -m pip install pip "setuptools==68.2.2" "wheel==0.41.2" twine rstcheck;
          python setup.py sdist bdist_wheel;
          rstcheck README.rst CHANGES.rst
          python -m twine check dist/*
      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*
          if-no-files-found: error
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10']
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    name: ${{ fromJson('{"macos-latest":"macOS","windows-latest":"Windows","ubuntu-latest":"Ubuntu"}')[matrix.os] }} ${{ matrix.python-version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python - ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: python -m pip install --upgrade pip setuptools nox

      - name: Run Tests
        run: ./ci/run_tests.sh
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          NOX_SESSION: ''
          PIP_INDEX_URL: https://:2023-10-02@time-machines-pypi.sealsecurity.io/


  coverage:
    if: false
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v2
      - name: Use latest Python so it understands all syntax
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install coverage
        run: python -m pip install --upgrade coverage

      - name: Download coverage data
        uses: actions/download-artifact@v2
        with:
          name: coverage-data

      - name: Combine & check coverage
        run: |
          python -m coverage combine
          python -m coverage html --skip-covered --skip-empty
          python -m coverage report --ignore-errors --show-missing --fail-under=100

      - name: Upload report if check failed
        uses: actions/upload-artifact@v2
        with:
          name: coverage-report
          path: htmlcov
        if: ${{ failure() }}
